    <title>George Alfred | Data Analytics Portfolio</title>
    <style>
        body {
            background-color: #0b0c10;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .slide-container {
            position: relative;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 25px;
        }
        .slide {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: block;
        }
        /* كود سحري بيقص الحتة اللي تحت من الصورة اللي فيها كلمة جاما لو حبيت */
        .crop-gamma {
            overflow: hidden;
            border-radius: 10px;
        }
        .crop-gamma img {
            margin-bottom: -35px; /* بيخبي العلامة المائية لو موجودة في أسفل الشريحة */
        }
    </style>
</head>
<body>

    <div class="slide-container"><img src="1_George-Alfred.png" alt="Slide 1" class="slide"></div>
